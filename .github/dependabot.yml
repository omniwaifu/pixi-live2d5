version: 2

updates:
    - package-ecosystem: "bun"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "America/Chicago"
      open-pull-requests-limit: 5
      groups:
          bun-dependencies:
              patterns:
                  - "*"
      ignore:
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"
          - dependency-name: "@types/node"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "pip"
      directory: "/docs"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "America/Chicago"
      open-pull-requests-limit: 5
      groups:
          docs-dependencies:
              patterns:
                  - "*"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "America/Chicago"
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - "*"
