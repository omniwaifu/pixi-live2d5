name: Publish Package to npmjs

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.3.14

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: Restore Cubism core cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: cache-core
              with:
                  path: |
                      core/live2dcubismcore.js
                      core/live2dcubismcore.d.ts
                  key: cubism-core-${{ runner.os }}-${{ hashFiles('scripts/setup.js') }}

            - run: bun install --frozen-lockfile --ignore-scripts

            - name: Download Cubism 5 core
              if: steps.cache-core.outputs.cache-hit != 'true'
              run: bun run setup

            - run: bun run prepare

            - name: Install Playwright Chromium
              run: bunx playwright install --with-deps chromium

            - run: bun run lint
            - run: bun run test
            - run: bun pm pack --dry-run

            # parse the package version to determine the npm tag to use (most likely "beta").
            # Example:
            # v0.5.0-beta -> beta
            # 0.5.0 -> latest
            - name: Determine npm tag
              id: npm-tag
              run: |
                  TAG=$(node -p "const version = require('./package.json').version.replace(/^v/, ''); const prerelease = version.split('-')[1]; prerelease ? prerelease.split('.')[0] : 'latest';")
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

            - name: Publish to NPM
              run: npm publish --tag "${{ steps.npm-tag.outputs.tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
